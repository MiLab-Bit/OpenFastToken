name: wallet-contracts
on:
  pull_request:
    paths:
      - '.github/workflows/wallet-contracts.yml'
      - 'go.mod'
      - 'go.sum'
      - 'model/**'
      - 'service/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/wallet-contracts.yml'
      - 'go.mod'
      - 'go.sum'
      - 'model/**'
      - 'service/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dual-wallet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Print Go toolchain
        run: go version
      - name: Execute 15 wallet and refund contract tests (uncached)
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          go test ./model ./service \
            -run '^(TestEnterpriseWalletRechargeAndGrant|TestGrantInsufficientBalance|TestConsumeEUQuotaNoNegative|TestRefundEUQuota|TestEnterpriseTopUpCallbackRouting|TestPersonalTopUpCallbackUnchanged|TestEnterpriseRefundRouting|TestCrossTenantGrantBlocked|TestCompositeFundingEnterprisePriority|TestCompositeFundingFallbackPersonal|TestCompositeFundingPureEnterpriseUser|TestCompositeFundingRefundOriginalPath|TestCompositeFundingNoEnterpriseUser|TestCompositeFundingReserveRollback|TestRefundReferralReversalIsIdempotent) \
            -count=1 -timeout=5m -v
 \
            -count=1 -timeout=5m -v
